<!DOCTYPE html>
<html>
    <head>
        <title>HTML Forms </title>
    </head>

<body style="background-color: rgb(254, 238, 217);">

<h1 align="center">Student Registration Form</h1>

<table border="1" cellspacing="0" cellpadding="0" align="center">
    <form action="">

<tr style="background-color: lightblue;" rowspan="2">
    <th colspan="2"> Registration Form</th>
</tr>

<tr>
    <td>Full Name</td>
    <td><input type="text" placeholder="Enter your name" required></td>
</tr>
<tr>
    <td>Email</td>
    <td><input type="email" placeholder="Enter your email" required></td>
</tr>
<tr>
    <td>Password</td>
    <td><input type="password" placeholder="Enter your Password" required></td>
</tr>
<tr>
    <td>Mobile Number</td>
    <td><input type="number" placeholder="Enter your Number"  required></td>
</tr>
<tr>
    <td>DOB</td>
    <td><input type="date" name="DOB" id="DOB"></td>
</tr>
<tr>
    <td>Gender</td>
    <td align="center"><input type="radio" name="male" id="male">male<input type="radio">female <input type="radio">other</td>
</tr>
<tr>
    <td>Hobbies</td>
    <td><input type="checkbox">Reading<input type="checkbox">Coding<input type="checkbox">Music<input type="checkbox">Sports</td>
</tr>
<tr>
    <td>Course</td>
    <td>
        <select name="state" placeholder="Course">
              <option selected disabled >Select Course</option>
              <option>BCA</option>
              <option>BAA</option>
              <option>BCOM</option>
        </select>
    </td>
</tr>

<tr>
    <td>State</td>
    <td>
        <select>
              <option selected disabled >Select State</option>
              <option>Delhi</option>
              <option>Bihar</option>
              <option>UP</option>
        </select>
    </td>
</tr>
<tr>
    <td>Adress</td>
    <td>
        <textarea name="Address" placeholder="Enter your Address" rows="5"></textarea>
    </td>
</tr>
<tr>
    <td>Upload Photo</td>
    <td>
        <input type="file">
    </td>
</tr>
<tr>
    <td>Favourit Colour</td>
    <td>
        <input type="color">
    </td>
</tr>

<tr>
    <td colspan="2" align="center">
    <input type="submit">
    <input type="reset">
    </td>
</tr>
</form>

<hr>
</form>
</table>

<hr>
</body>
</html>
